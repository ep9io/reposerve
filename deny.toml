# Dependency policy.
#
# The gate is narrow on purpose: vulnerabilities, licences, duplicate crates and
# untrusted sources. It does not choose versions.

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
# The allow-list is the set of licences measured from the resolved graph. A new
# dependency with another licence fails until someone adds it here on purpose.
#
# `MPL-2.0` covers the Servo style crates that `ammonia` uses. The obligation is
# at the file level: a modified MPL file must stay under MPL. `ISC` and `CC0-1.0`
# cover `inotify`, `phf` and `notify-types`. All three are permissive or weak
# copyleft, and none changes the licence of this crate.
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Dependency policy.
#
# The gate is narrow on purpose: vulnerabilities, licences, duplicate crates and
# untrusted sources. It does not choose versions.

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
# The allow-list is the set of licences measured from the resolved graph. A new
# dependency with another licence fails until someone adds it here on purpose.
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
